<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContriLog · AI Team Manager</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1d2733; --ink-2: #3b4754; --muted: #6b7684; --faint: #9aa4b0;
    --line: #e3e8ee; --line-2: #eef1f5; --soft: #f6f8fa;
    --brand: #1f3a5f; --brand-2: #2c5282; --focus: #3867d6;
    --green: #1f7a4d; --green-bg: #e7f5ec; --green-line: #b9e1c8;
    --amber: #a35a00; --amber-bg: #fff4e0; --amber-line: #f5d29a; --amber-solid: #e8930c;
    --red: #b42318; --red-bg: #fdecea; --red-line: #f4c2bc;
    --teal: #0b7285; --teal-bg: #e3f6f8; --teal-line: #a9dfe6;
    --gray-bg: #f0f2f5; --violet: #5b3fa0; --violet-bg: #f4f0fb; --violet-line: #ddd2f2;
    --radius: 12px; --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-size: 14.5px; line-height: 1.5;
         font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
  button, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- header ---------- */
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .hbar { display: flex; align-items: center; gap: 18px; height: 54px; }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand b { font-size: 18px; letter-spacing: -.3px; color: var(--brand); }
  .brand span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .proj { min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); padding-left: 16px; }
  .proj .n { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj .o { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hright { margin-left: auto; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--green);
          background: var(--green-bg); border: 1px solid var(--green-line); border-radius: 999px; padding: 3px 10px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.8s ease-in-out infinite; }
  .live.off { color: var(--muted); background: var(--gray-bg); border-color: var(--line); }
  .live.off i { background: var(--faint); animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }
  .now { text-align: right; line-height: 1.25; }
  .now .t { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14.5px; }
  .now .s { font-size: 11.5px; color: var(--muted); }

  .tbar { display: flex; align-items: center; gap: 10px; padding: 8px 0 10px; flex-wrap: wrap; }
  .scn { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .scn select { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-weight: 600; max-width: 330px; }
  .scn .d { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
  .tbar .sp { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 14px; font-weight: 600;
         cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: #c9d2dc; background: var(--soft); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--brand-2); }
  .btn.ghost { background: transparent; }
  .toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; user-select: none; }
  .toggle input { display: none; }
  .toggle .sw { width: 32px; height: 18px; border-radius: 999px; background: #cdd5df; position: relative; transition: background .2s; }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .2s; }
  .toggle input:checked + .sw { background: var(--brand); }
  .toggle input:checked + .sw::after { left: 16px; }
  .interp select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; background: var(--card); color: var(--ink-2); }

  /* ---------- summary cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 12px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .sum { display: flex; align-items: center; gap: 12px; padding: 7px 16px; }
  .sum .num { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.5px; min-width: 28px; }
  .sum .lab { font-size: 13.5px; font-weight: 700; }
  .sum .sub { font-size: 12px; color: var(--muted); }
  .sum.total .num { color: var(--brand); }
  .sum.ok { border-left: 4px solid var(--green); } .sum.ok .num { color: var(--green); }
  .sum.check { border-left: 4px solid var(--amber-solid); } .sum.check .num { color: var(--amber); }
  .sum.block { border-left: 4px solid var(--red); } .sum.block .num { color: var(--red); }
  .sum.done { border-left: 4px solid var(--teal); } .sum.done .num { color: var(--teal); }
  .sum.hot { background: var(--red-bg); }

  /* ---------- badges ---------- */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
           border: 1px solid transparent; white-space: nowrap; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .b-ok { color: var(--green); background: var(--green-bg); border-color: var(--green-line); }
  .b-check { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-line); }
  .b-block { color: var(--red); background: var(--red-bg); border-color: var(--red-line); }
  .b-done { color: var(--teal); background: var(--teal-bg); border-color: var(--teal-line); }
  .b-gray { color: var(--muted); background: var(--gray-bg); border-color: var(--line); }
  .b-violet { color: var(--violet); background: var(--violet-bg); border-color: var(--violet-line); }
  .b-big { font-size: 14px; padding: 4px 12px; }

  /* ---------- layout ---------- */
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .sect-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
  .sect-h h2 { font-size: 14.5px; margin: 0; }
  .sect-h .r { margin-left: auto; font-size: 12px; color: var(--muted); }

  /* ---------- hero ---------- */
  .hero { overflow: hidden; }
  .hero-top { display: flex; align-items: flex-start; gap: 14px; padding: 12px 18px 6px; }
  .eyebrow { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .2px; }
  .hero-title { font-size: 19px; font-weight: 800; letter-spacing: -.4px; margin: 1px 0 2px; }
  .hero-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
  .hero-meta b { font-weight: 700; color: var(--ink); }
  .hero-meta .warn { color: var(--red); font-weight: 700; }
  .hero-top .st { margin-left: auto; padding-top: 4px; }

  .stepper { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 4px 18px 10px; border-bottom: 1px solid var(--line-2); }
  .step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; }
  .step::before { content: ""; position: absolute; top: 12px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
  .step:first-child::before { display: none; }
  .step.done::before, .step.cur::before { background: var(--green); }
  .step .dot { position: relative; z-index: 1; width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center;
               font-size: 12px; font-weight: 800; background: var(--card); border: 2px solid var(--line); color: var(--faint); }
  .step .nm { font-size: 12.5px; font-weight: 600; color: var(--faint); line-height: 1.25; }
  .step .sub2 { font-size: 11px; color: var(--faint); min-height: 14px; }
  .step.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
  .step.done .nm { color: var(--ink-2); }
  .step.cur .dot { border-color: var(--focus); color: var(--focus); box-shadow: 0 0 0 4px rgba(56, 103, 214, .15); }
  .step.cur .nm { color: var(--focus); font-weight: 800; }
  .step.cur .sub2 { color: var(--focus); font-weight: 600; }
  .step.wait .dot { border-color: var(--amber-solid); color: var(--amber); box-shadow: 0 0 0 4px rgba(232, 147, 12, .18); }
  .step.wait .nm, .step.wait .sub2 { color: var(--amber); font-weight: 800; }
  .step.stop .dot { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .step.stop .nm { color: var(--red); }
  .step.skip .nm { text-decoration: line-through; }

  .hero-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 18px 16px; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .blk-h { font-size: 12.5px; font-weight: 800; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .blk-h .r { margin-left: auto; font-weight: 600; }

  .judge { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; background: var(--soft); }
  .judge .head { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .judge ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .judge li { position: relative; padding-left: 16px; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
  .judge li::before { content: "•"; position: absolute; left: 4px; color: var(--faint); }
  .judge li.next { color: var(--ink); font-weight: 600; }
  .judge li.next::before { content: "→"; left: 0; color: var(--focus); }
  .j-check { border-color: var(--amber-line); background: var(--amber-bg); }
  .j-block { border-color: var(--red-line); background: var(--red-bg); }
  .j-ok { border-color: var(--green-line); background: var(--green-bg); }
  .j-done { border-color: var(--teal-line); background: var(--teal-bg); }

  .chat { display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 92%; border-radius: 12px; padding: 8px 12px; font-size: 13.5px; }
  .msg .who { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 1px; }
  .msg.ai { align-self: flex-start; background: #eef3fb; border: 1px solid #d8e3f5; }
  .msg.ai .who { color: var(--brand-2); }
  .msg.human { align-self: flex-end; background: var(--card); border: 1px solid var(--line); }
  .typing { align-self: flex-end; font-size: 12.5px; color: var(--muted); padding: 2px 6px; }
  .typing i { display: inline-block; width: 5px; height: 5px; background: var(--faint); border-radius: 50%; margin-left: 3px; animation: pulse 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  .reading { border: 1px solid var(--violet-line); background: var(--violet-bg); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
  .reading .lab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; }
  .reading .by { font-size: 12px; color: var(--violet); font-weight: 600; }
  .reading .q { color: var(--ink-2); margin-top: 3px; }
  .reading .q em { font-style: normal; background: #fff; border-radius: 4px; padding: 0 4px; }

  .panel { border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; }
  .panel h3 { margin: 0 0 6px; font-size: 15px; }
  .ticks { list-style: none; margin: 6px 0 0; padding: 0; }
  .ticks li { position: relative; padding-left: 22px; margin-top: 5px; font-size: 13.5px; }
  .ticks li::before { content: "✓"; position: absolute; left: 2px; top: 0; color: var(--green); font-weight: 800; }
  .ticks .rec { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .others { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .quote { margin-top: 8px; background: var(--soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--ink-2); }
  .quote .tx { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .quote .k { font-size: 11.5px; font-weight: 700; color: var(--muted); display: block; }

  .decide { border: 2px solid var(--amber-solid); background: var(--amber-bg); border-radius: 12px; padding: 12px 16px; text-align: center; }
  .decide h3 { margin: 0; font-size: 17px; color: #7a4300; }
  .decide p { margin: 4px 0 10px; font-size: 13px; color: var(--ink-2); }
  .decide .btns { display: flex; gap: 10px; justify-content: center; }
  .decide .btns .btn { padding: 9px 18px; font-size: 14.5px; }
  .btn.approve { background: var(--green); border-color: var(--green); color: #fff; min-width: 160px; }
  .btn.approve:hover:not(:disabled) { background: #186640; }
  .btn.reject { min-width: 90px; }
  .decided { border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
  .decided.okk { background: var(--green-bg); border: 1px solid var(--green-line); }
  .decided.nok { background: var(--red-bg); border: 1px solid var(--red-line); }
  .decided .ln { font-weight: 700; font-size: 14px; display: flex; gap: 8px; }
  .decided .ln small { color: var(--muted); font-weight: 600; font-size: 12px; margin-left: auto; }
  .ln.g { color: var(--green); } .ln.r { color: var(--red); }

  .resolve { border-radius: 10px; padding: 11px 14px; }
  .resolve.watch { border: 1px dashed var(--teal-line); background: #f5fbfc; }
  .resolve.ok { border: 1px solid var(--teal-line); background: var(--teal-bg); }
  .resolve .t { font-weight: 800; font-size: 14.5px; }
  .resolve.ok .t { color: var(--teal); font-size: 16px; }
  .resolve .d { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .resolve .rec { margin-top: 6px; background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .resolve .dur { margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--teal); }
  .limit { border: 1px solid var(--amber-line); background: var(--amber-bg); border-radius: 10px; padding: 10px 14px; }
  .limit .t { font-weight: 800; color: var(--amber); }
  .limit .d { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .memnote { font-size: 12.5px; color: var(--teal); font-weight: 600; }

  .idle { padding: 26px 22px 28px; text-align: center; }
  .idle .big { font-size: 17px; font-weight: 800; margin: 8px 0 4px; }
  .idle .d { color: var(--muted); font-size: 13.5px; }
  .scan { width: 220px; height: 4px; margin: 6px auto 0; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
  .scan::after { content: ""; position: absolute; inset: 0; background: var(--focus); opacity: .5; animation: pulse 1.4s ease-in-out infinite; }
  .watchlist { margin: 14px auto 0; max-width: 560px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
  .watchlist .w { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; }
  .watchlist .w .x { color: var(--muted); font-size: 12.5px; margin-left: auto; text-align: right; }

  .busy { display: flex; align-items: center; gap: 8px; padding: 6px 18px; font-size: 12.5px; color: var(--focus); background: #f3f6fd; border-top: 1px solid var(--line-2); }
  .busy i { width: 7px; height: 7px; border-radius: 50%; background: var(--focus); animation: pulse 1s infinite; }

  /* ---------- details / tech ---------- */
  details.tech { border-top: 1px dashed var(--line); padding-top: 6px; font-size: 12.5px; color: var(--muted); }
  details.tech summary { cursor: pointer; font-weight: 600; color: var(--muted); list-style: none; }
  details.tech summary::before { content: "▸ "; }
  details.tech[open] summary::before { content: "▾ "; }
  details.tech .in { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; word-break: break-all; }
  .id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; background: var(--gray-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: var(--ink-2); }

  /* ---------- side ---------- */
  .feed { max-height: 360px; overflow-y: auto; padding: 4px 14px 10px; }
  .fe { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
  .fe:last-child { border-bottom: none; }
  .fe .tm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .fe .tx b { font-weight: 700; }
  .fe .tk { color: var(--muted); font-size: 12px; }
  .fe .raw { color: var(--faint); font-size: 11.5px; word-break: break-all; }
  .fe.key .tx { color: var(--ink); }
  .empty { color: var(--muted); padding: 16px 4px; text-align: center; font-size: 13px; }
  .memc { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 9px; }
  .memc .intro { font-size: 13px; color: var(--ink-2); }
  .mcount { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mcount div { background: var(--soft); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; color: var(--ink-2); display: flex; justify-content: space-between; }
  .mcount b { font-variant-numeric: tabular-nums; }
  .adj { border-left: 3px solid var(--teal); background: #f5fbfc; border-radius: 0 8px 8px 0; padding: 6px 10px; font-size: 13px; }
  .adj .h { font-weight: 800; color: var(--teal); }
  .adj .w { color: var(--muted); font-size: 12px; }
  .privacy { font-size: 12.5px; color: var(--ink-2); background: var(--gray-bg); border-radius: 8px; padding: 7px 10px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 16px 14px; }
  .stats div { background: var(--soft); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); }
  .stats b { display: block; font-size: 16px; color: var(--ink); }
  details.box > summary { cursor: pointer; list-style: none; }
  details.box > summary::-webkit-details-marker, details.tech > summary::-webkit-details-marker { display: none; }
  details.box > summary h2::after { content: " ▸"; color: var(--faint); font-weight: 400; }
  details.box[open] > summary h2::after { content: " ▾"; }
  .rawmem { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); max-height: 220px; overflow-y: auto; }

  /* ---------- table ---------- */
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 9px 16px; border-bottom: 1px solid var(--line); background: var(--soft); }
  .tbl td { padding: 9px 16px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr.hl td { background: #f3f6fd; }
  .tbl tr.hl td:first-child { box-shadow: inset 3px 0 0 var(--focus); }
  .tbl .t1 { font-weight: 700; }
  .tbl .mut { color: var(--muted); font-size: 13px; }
  .tbl .od { color: var(--red); font-weight: 700; }
  .tblwrap { overflow-x: auto; }
  section.tasks { margin: 14px 0 28px; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #2b2f36; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 50; animation: fade .3s ease both; max-width: 90vw; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .fx { animation: fade .5s ease both; }  /* 새로 나타난 요소에만 */
  .flash { animation: flash 1.6s ease both; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(56, 103, 214, .0); } 25% { box-shadow: 0 0 0 4px rgba(56, 103, 214, .25); } 100% { box-shadow: 0 0 0 0 rgba(56, 103, 214, 0); } }

  /* ---------- demo mode: 기술 정보 숨김, 핵심 사건만, 큰 승인 버튼 ---------- */
  .rawid { display: none !important; }
  body.showids .rawid { display: revert !important; }
  body.showids span.rawid { display: inline !important; }
  body.demo .tech, body.demo .techonly, body.demo .rawid { display: none !important; }
  body.demo .fe:not(.key) { display: none; }
  body.demo .decide { padding: 18px 18px; }
  body.demo .decide h3 { font-size: 20px; }
  body.demo .decide .btns .btn { font-size: 16px; padding: 12px 22px; }
  body.demo .btn.approve { min-width: 220px; }

  /* ---------- responsive ---------- */
  @media (max-width: 1180px) { .main { grid-template-columns: minmax(0, 1fr); } .side { display: grid; grid-template-columns: 1fr 1fr; } }
  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .hero-body { grid-template-columns: minmax(0, 1fr); }
    .side { display: flex; }
    .proj { display: none; }
    .scn .d { display: none; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stepper { grid-template-columns: repeat(7, minmax(44px, 1fr)); overflow-x: auto; }
    .step .nm { font-size: 11px; } .step .sub2 { display: none; }
    .hero-top { flex-direction: column; } .hero-top .st { margin-left: 0; }
    .hbar { flex-wrap: wrap; height: auto; padding: 8px 0 2px; gap: 6px 12px; }
    .hright { margin-left: 0; gap: 10px; }
    .scn, .scn select { max-width: 100%; }
    .hbar .now .s, .brand span { display: none; }
    .tbl .hide-s { display: none; }
  }
</style>
</head>
<body>

        <option value="llm">답장 해석: AI (Qwen3)</option><option value="rule">답장 해석: 규칙 기반 (비교용)</option></select></label>
      <button class="btn ghost" id="btnStart">새로 시작</button>
      <button class="btn" id="btnNext" disabled>다음 단계</button>

<div class="wrap">
  <div class="cards" id="cards"></div>
  <div class="main">
    <section class="card hero" id="hero"></section>
    <aside class="side">
      <section class="card" id="memCard"></section>
      <section class="card">
        <div class="sect-h"><h2>AI 활동 기록</h2><span class="r" id="feedNote"></span></div>
        <div class="feed" id="feed"></div>
      </section>
      <details class="card box techonly" id="techBox">
        <summary><div class="sect-h"><h2>Agent 활동 상세</h2><span class="r">개발·검증용</span></div></summary>
        <label class="toggle" style="padding:10px 16px 0"><input type="checkbox" id="showIds"><span class="sw"></span>기술 ID·원본 기록 함께 보기</label>
        <div class="stats" id="stats"></div>
        <div class="rawmem" id="rawMem"></div>
      </details>

    <div class="tblwrap"><table class="tbl"><thead><tr><th>업무</th><th>담당자</th><th>마감</th><th class="hide-s">진행 상태</th><th>AI 판단</th></tr></thead><tbody id="taskRows"></tbody></table></div>
  </section>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// ------------------------------------------------------------ 표시 용어 (화면 전용)
const SCN = {
  webhook: {name: "① 업무 막힘 발견 → 지원 → 해결", desc: "웹훅 서명 오류 · ShipTrack (P002)"},
  p001: {name: "② 담당자 확인이 필요한 업무 막힘", desc: "Claim 검증 API 검색 0건 · TeamLens (P001)"},
  map: {name: "③ AI 지원자 선정 한계 사례", desc: "운영에서만 지도가 회색 · ShipTrack (P002)"},
};
const AGENT_STATE = {
  NORMAL: ["정상", "b-ok"], STAGNATION_CANDIDATE: ["확인 필요", "b-check"], CONFIRMED_BLOCK: ["막힘", "b-block"], RESOLVED: ["해결", "b-done"],
};
const TASK_STATUS = {TODO: "시작 전", IN_PROGRESS: "진행 중", IN_REVIEW: "검토 중", DONE: "완료"};
const SEMANTIC = {
  REPORTS_BLOCKED: "막힘", REPORTS_ON_TRACK: "정상 진행", CONFIRMS_COMPLETION: "완료 보고", NOT_INFORMATIVE: "판단하기 어려운 답변",
  ACCEPTS_SUPPORT: "지원 수락", DECLINES_SUPPORT: "지원 어려움",
};
const BLOCK_KIND = {INTERNAL_ISSUE: "내부 기술 문제", EXTERNAL_DEPENDENCY: "외부 의존 문제"};
const MEM_LABEL = {TRUE_POSITIVE: "실제 막힘이었음", FALSE_POSITIVE: "괜한 확인이었음", RESOLUTION_SUCCESS: "지원 후 해결", UNRESOLVED: "확인하지 못함"};
const STEPS = ["이상 징후 발견", "담당자 확인", "업무 막힘 확인", "지원자 탐색", "PM 승인", "지원 요청", "해결 확인"];
const ID_RE = /\b(?:REV|MSG|RPL|ACT|MEM|STR|UT|MT|CLM|DOC)-[A-Z0-9-]+\b/g;

// ------------------------------------------------------------ 상태
const S = {seen: new Set(), state: null, shown: new Set(), queue: [], timer: null, playing: false, busy: false, heroRun: null, finalTasks: null, toastT: null};
let demo = false;
try { demo = localStorage.getItem("contrilog.demo") === "1"; } catch (e) { /* 저장소 없음: 기본값 */ }

// ------------------------------------------------------------ 시간·숫자 표현
const WD = "일월화수목금토";
const D = iso => new Date(iso);
const md = iso => { const d = D(iso); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const hm = iso => { const d = D(iso); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const mdhm = iso => `${md(iso)} ${hm(iso)}`;
const full = iso => { const d = D(iso); return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")} (${WD[d.getDay()]}) ${hm(iso)}`; };
function dur(h) {
  h = Math.round(Math.abs(h));
  if (h < 48) return `${h}시간`;
  const d = Math.floor(h / 24), r = h % 24;
  return r ? `${d}일 ${r}시간` : `${d}일`;
}
const hoursBetween = (a, b) => (D(b) - D(a)) / 3600000;
const nameOf = id => (S.state && S.state.members && S.state.members[id]) || id;
const people = txt => String(txt ?? "").replace(/\bM_[A-Z]\b/g, m => nameOf(m));
const noIds = txt => String(txt ?? "").replace(/\s*\((?:[^()]*?\b(?:REV|MSG|RPL|ACT|MEM)-\d+[^()]*)\)/g, "");
const ids = list => (list || []).filter(Boolean).map(x => `<span class="id">${esc(x)}</span>`).join(" ");
const transTo = e => { const m = /→\s*([A-Z_]+)/.exec(e.summary || ""); return e.kind === "DECISION" && e.label !== "Memory" && m ? m[1] : null; };
const semanticOf = e => { const m = /→\s*([A-Z_]+)/.exec(e.summary || ""); return m ? m[1] : null; };

function modelLabel(s) {
  if (!s) return "";
  if (/qwen3[:\s-]?32b/i.test(s)) return "Qwen3 32B";
  const m = /\(([^)]+)\)/.exec(s);
  if (/anthropic|claude/i.test(s)) return "Claude";
  if (/규칙/.test(s)) return "규칙 기반";
  return m ? m[1] : s;
}

// ------------------------------------------------------------ API
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {cache: "no-store"} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(S.toastT); S.toastT = setTimeout(() => t.remove(), 4200);
}

// ------------------------------------------------------------ 이벤트 공개 (같은 시각에 일어난 일을 한 단계씩 보여 줌)
const PACE = {OBSERVE: 0, DECISION: 700, CHECK_IN: 800, REPLY: 1000, SUPPORT_ANALYSIS: 1000, INTERVENTION: 800, HUMAN: 600, ACTION: 800, SUPPORT_RESPONSE: 900, FOLLOW_UP: 600};
function heroEpisode() {
  const s = S.state; if (!s || !s.view) return null;
  const eps = s.view.episodes;
  if (s.pending.length) {
    const ep = eps.find(e => e.action && e.action.action_id === s.pending[0].action_id);
    if (ep) return ep;
  }
  if (S.decidedRun) {  // 방금 결정한 업무는 다음 단계 전까지 화면에 유지 (승인·전송 결과 확인용)
    const ep = eps.find(e => e.run_id === S.decidedRun);
    if (ep) return ep;
  }
  const focus = eps.filter(e => e.task_id === s.scenario.focus_task && S.shown.has(`${e.run_id}-0`));
  if (focus.length) return [...focus].reverse().find(e => e.confirmed_at) || focus[focus.length - 1];
  if (S.heroRun) return eps.find(e => e.run_id === S.heroRun) || null;
  return null;
}
function ingest(state, instant) {
  const prev = S.state;
  S.finalTasks = state.tasks;
  if (!prev || prev.scenario.key !== state.scenario.key || state.events.length < S.shown.size) instant = true;
  S.state = state;
  const fresh = state.events.filter(e => !S.shown.has(e.id));
  clearTimeout(S.timer);
  S.queue.forEach(e => S.shown.add(e.id));  // 이전에 남은 공개 대기분은 즉시 공개
  S.queue = [];
  if (instant) { fresh.forEach(e => S.shown.add(e.id)); render(); return Promise.resolve(); }
  // 히어로 업무와 무관한 사건은 바로 공개, 히어로 업무 사건만 한 단계씩
  const focusTask = state.scenario.focus_task;
  const pendTask = state.pending.length ? state.pending[0].task_id : null;
  for (const e of fresh) {
    const paced = e.task_id === focusTask || e.task_id === pendTask || (S.heroRun && e.id.startsWith(S.heroRun + "-"));
    if (paced) S.queue.push(e); else S.shown.add(e.id);
  }
  render();
  if (demo) { revealToCheckpoint(); return Promise.resolve(); }  // 시연 모드: 다음 체크포인트까지만 공개하고 멈춤
  return new Promise(resolve => {
    const step = () => {
      if (!S.queue.length) { render(); resolve(); return; }
      const e = S.queue.shift(); S.shown.add(e.id); render();
      const next = S.queue[0];
      const wait = next ? (PACE[next.kind] ?? 600) * (demo ? 1.35 : 1) * (next.label === "Memory" ? 0 : 1) : 0;
      S.timer = setTimeout(step, wait);
    };
    S.timer = setTimeout(step, 250);
  });
}
const revealing = () => S.queue.length > 0;
// 시연 모드 체크포인트: 이 사건을 공개한 직후 멈춘다 (사건의 시각·순서는 서버 기록 그대로, 표시만 나눔)
const CHECKPOINT_KINDS = new Set(["CHECK_IN", "SUPPORT_ANALYSIS", "INTERVENTION", "ACTION", "SUPPORT_RESPONSE"]);
const isCheckpoint = e => CHECKPOINT_KINDS.has(e.kind) || (e.kind === "REPLY" && !e.reply_text)
  || ["STAGNATION_CANDIDATE", "CONFIRMED_BLOCK", "NORMAL", "RESOLVED"].includes(transTo(e));
function revealToCheckpoint() {
  while (S.queue.length) {
    const e = S.queue.shift(); S.shown.add(e.id);
    if (isCheckpoint(e)) {
      while (S.queue.length && S.queue[0].label === "Memory") S.shown.add(S.queue.shift().id);  // 같은 판단의 Memory 기록은 함께
      break;
    }
  }
  render();
}
const fx = k => (S.seen.has(k) ? "" : (S.seen.add(k), "fx"));  // 처음 나타날 때만 fade

// ------------------------------------------------------------ 렌더링
function render() {
  const s = S.state;
  document.body.classList.toggle("demo", demo);
  $("demoMode").checked = demo;
  if (!s) return;
  $("projName").textContent = s.scenario.project;
  $("projOrg").textContent = (SCN[s.scenario.key] || {}).name ? `시나리오 ${SCN[s.scenario.key].name}` : s.scenario.title;
  $("nowT").textContent = full(s.as_of);
  $("nowS").innerHTML = `가상 시각 · 답장 해석 · ${esc(modelLabel(s.interpreter))}`;
  const live = $("live");
  live.classList.toggle("off", !!s.finished);
  $("liveTx").textContent = s.finished ? "시나리오 마지막 시점" : "AI 모니터링 중";

  const pending = s.pending.length > 0;
  // 시연 모드에서는 아직 공개하지 않은 사건이 남아 있으면 [다음 단계]로 공개, PM 결정 대기 화면에서는 막힘
  const blocked = demo ? (!revealing() && (s.finished || pending)) : (s.finished || pending);
  $("btnNext").disabled = S.busy || blocked;
  $("btnPlay").disabled = blocked && !S.playing;
  $("btnNext").title = pending && !revealing() ? "PM 결정을 먼저 해 주세요" : "";
  if ((pending || s.finished) && S.playing && !revealing()) stopPlay();

  const ep = heroEpisode();
  if (ep) S.heroRun = ep.run_id;
  // 공개 중에는 직전 상태를 쓰되, 히어로 업무는 이미 공개된 사건으로 판단한 상태를 표시 (미래 사건 미사용)
  let shownTasks = revealing() ? (S.prevTasks || s.tasks) : s.tasks;
  if (ep && revealing()) {
    const p = progress(ep);
    const st = p.resolved ? "RESOLVED" : p.block ? "CONFIRMED_BLOCK" : p.toNormal ? "NORMAL" : p.candidate ? "STAGNATION_CANDIDATE" : null;
    if (st) shownTasks = shownTasks.map(t => t.task_id === ep.task_id ? {...t, agent_state: st} : t);
  }
  renderCards(shownTasks);
  renderHero(ep);
  renderMemory();
  renderFeed();
  renderTech();
  renderTable(shownTasks, ep);
  if (!revealing()) S.prevTasks = s.tasks;
}

function renderCards(tasks) {
  const c = {NORMAL: 0, STAGNATION_CANDIDATE: 0, CONFIRMED_BLOCK: 0, RESOLVED: 0};
  tasks.forEach(t => { c[t.agent_state] = (c[t.agent_state] || 0) + 1; });
  const card = (cls, n, lab, sub) => `<div class="card sum ${cls}"><div class="num">${n}</div><div><div class="lab">${lab}</div><div class="sub">${sub}</div></div></div>`;
  $("cards").innerHTML =
    card("total", tasks.length, "전체 업무", "AI가 지켜보는 업무") +
    card("ok", c.NORMAL, "정상", "특이 사항 없음") +
    card("check", c.STAGNATION_CANDIDATE, "확인 필요", "담당자에게 확인 중") +
    card("block" + (c.CONFIRMED_BLOCK ? " hot" : ""), c.CONFIRMED_BLOCK, "막힘", "도움이 필요한 업무") +
    card("done", c.RESOLVED, "해결", "지원 후 해결 확인");
}

// 히어로 업무의 공개된 사건으로 진행 단계를 계산한다 (미래 사건은 아직 공개되지 않았으므로 나오지 않음)
function progress(ep) {
  const evs = S.state.events.filter(e => e.id.startsWith(ep.run_id + "-") && S.shown.has(e.id));
  const find = f => evs.find(f);
  const p = {evs};
  p.candidate = find(e => transTo(e) === "STAGNATION_CANDIDATE");
  p.checkin = find(e => e.kind === "CHECK_IN");
  p.reply = find(e => e.kind === "REPLY" && e.reply_text);
  p.noReply = find(e => e.kind === "REPLY" && !e.reply_text);
  p.toNormal = find(e => transTo(e) === "NORMAL");
  p.block = find(e => transTo(e) === "CONFIRMED_BLOCK");
  p.analysis = find(e => e.kind === "SUPPORT_ANALYSIS");
  p.proposed = find(e => e.kind === "INTERVENTION");
  p.human = find(e => e.kind === "HUMAN");
  p.approved = p.human && /APPROVED/.test(p.human.summary);
  p.rejected = p.human && /REJECTED/.test(p.human.summary);
  p.sent = find(e => e.kind === "ACTION");
  p.supResp = find(e => e.kind === "SUPPORT_RESPONSE");
  p.resolved = find(e => transTo(e) === "RESOLVED");
  p.resolvedMem = find(e => e.label === "Memory" && /RESOLUTION_SUCCESS/.test(e.summary));
  p.pending = S.state.pending.find(a => ep.action && a.action_id === ep.action.action_id);
  p.external = p.block && ep.support && ep.support.block_kind === "EXTERNAL_DEPENDENCY";
  p.noSupporter = p.analysis && ep.support && !ep.support.supporter;
  return p;
}

function stage(p) {
  if (p.resolved) return ["해결 확인", "b-done"];
  if (p.rejected) return ["PM 거절 · 전송 안 함", "b-gray"];
  if (p.sent) return ["지원 요청 전송", "b-block"];
  if (p.approved) return ["PM 승인", "b-block"];
  if (p.proposed) return ["지원 제안 · PM 결정 대기", "b-check"];
  if (p.block) return ["막힘 확인", "b-block"];
  if (p.toNormal) return ["정상 진행", "b-ok"];
  if (p.candidate) return ["확인 필요", "b-check"];
  return ["관찰 중", "b-gray"];
}

function stepperHtml(p) {
  const done = [!!p.candidate, !!(p.reply || p.toNormal), !!p.block, !!p.analysis, !!p.approved, !!p.sent, !!p.resolved];
  const sub = ["", "", "", "", "", "", ""];
  let stopAt = -1, stopKind = "";
  if (p.toNormal && !p.block) { stopAt = 2; stopKind = "skip"; sub[1] = "정상 진행 답변"; }
  if (p.external || p.noSupporter) { stopAt = 3; stopKind = "stop"; sub[3] = "팀 내 지원 대상 아님"; }
  if (p.rejected) { stopAt = 4; stopKind = "stop"; sub[4] = "거절 · 전송 안 함"; }
  let cur = done.indexOf(false);
  return `<div class="stepper">${STEPS.map((nm, i) => {
    let cls = "", dot = i + 1;
    if (done[i]) { cls = "done"; dot = "✓"; }
    else if (stopAt >= 0 && i === stopAt && stopKind === "stop") { cls = "stop"; dot = "✕"; }
    else if (stopAt >= 0 && i >= stopAt) { cls = "skip"; if (i === stopAt) sub[i] = "필요 없음"; }
    else if (i === cur) {
      cls = "cur";
      if (i === 1) sub[i] = !p.checkin ? "질문 준비" : p.noReply ? "답장 없음 · 계속 관찰" : "답장 대기";
      if (i === 4 && p.pending && p.proposed) { cls = "wait"; sub[i] = "결정 대기"; }
      if (i === 4 && !p.proposed) sub[i] = "제안 준비";
      if (i === 6) sub[i] = "해결 여부 확인 중";
      if (i === 0) sub[i] = "관찰 중";
      if (i === 2 || i === 3 || i === 5) sub[i] = "진행 중";
    }
    return `<div class="step ${cls}"><div class="dot">${dot}</div><div class="nm">${nm}</div><div class="sub2">${esc(sub[i])}</div></div>`;
  }).join("")}</div>`;
}

function parseCheck(ep) {
  const c = ep.check || {}; const out = {};
  for (const r of c.reasons || []) {
    let m = /마감까지 (-?[\d.]+)시간/.exec(r); if (m) out.due = parseFloat(m[1]);
    m = /마지막 Task 기록\(([^)]+)\)/.exec(r); if (m) out.lastId = m[1];
  }
  return {...c, ...out};
}

function judgmentHtml(ep, p) {
  const c = parseCheck(ep);
  const reasons = [];
  if (c.due != null) reasons.push(c.due >= 0 ? `마감까지 <b>${dur(c.due)}</b> 남았습니다` : `마감이 <b>${dur(c.due)}</b> 지났습니다`);
  if (c.idle_hours != null) reasons.push(`마지막 작업 기록 이후 <b>${dur(c.idle_hours)}</b> 동안 새 기록이 없습니다 <span style="color:var(--muted)">(이 시점의 허용 기준 ${dur(c.limit_hours)})</span>`);
  if ((c.team_pause_hours || 0) > 0) reasons.push(`팀 전체가 쉬던 ${dur(c.team_pause_hours)}은 공백에서 빼고 판단했습니다`);
  if ((c.memory_adjustment_hours || 0) !== 0) reasons.push(`AI 판단 보정 적용: 허용 공백 ${c.memory_adjustment_hours > 0 ? "+" : ""}${dur(c.memory_adjustment_hours)}`);
  let cls = "j-check", head = "확인 필요 — 작업 기록이 평소보다 오래 멈춰 있습니다", next = "기록만으로는 막힘인지 알 수 없어 담당자에게 직접 물어봅니다";
  const kind = p.block ? (ep.support && ep.support.block_kind) || (/EXTERNAL_DEPENDENCY/.test(p.block.summary) ? "EXTERNAL_DEPENDENCY" : "INTERNAL_ISSUE") : null;
  if (p.resolved) { cls = "j-done"; head = "해결 확인 — 지원 이후 새 작업 기록이 생겼습니다"; next = "업무가 다시 움직이는 것을 기록으로 확인했습니다"; }
  else if (p.block) {
    cls = "j-block"; head = `막힘 확인 — ${BLOCK_KIND[kind] || "기술 문제"}`;
    next = kind === "EXTERNAL_DEPENDENCY" ? "팀 밖의 승인·의존 문제라 팀 내 지원을 제안하지 않습니다" : p.analysis ? "이 문제를 도울 수 있는 동료를 기록에서 찾았습니다" : "도울 수 있는 동료를 기록에서 찾고 있습니다";
  } else if (p.toNormal) { cls = "j-ok"; head = "정상 진행 — 추가 조치가 필요 없습니다"; next = /완료/.test(p.toNormal.summary) ? "업무가 완료 상태로 확인되었습니다" : "담당자가 계획대로 진행 중이라고 답했습니다. 마감 임박 전까지 다시 묻지 않습니다"; }
  else if (p.noReply) { next = "답장이 없어도 막힘으로 추측하지 않고 계속 지켜봅니다"; }
  else if (p.checkin) { next = "담당자에게 진행 상황을 물었습니다. 답장을 기다리는 중입니다"; }
  return `<div class="judge ${cls}">
      <div class="head">${esc(head)}</div>
      ${c.at ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">발견 당시(${esc(mdhm(c.at))}) 관찰한 근거</div>` : ""}
      <ul>${reasons.map(r => `<li>${r}</li>`).join("")}<li class="next">${esc(next)}</li></ul>
    </div>
    <details class="tech"><summary>근거 상세 보기</summary><div class="in">
      <div>업무 ${ids([ep.task_id])} · 판단 기록 ${ids([ep.run_id])}${c.lastId ? ` · 마지막 작업 기록 ${ids([c.lastId])}` : ""}</div>
      ${(c.reasons || []).map(r => `<div>${esc(r)}</div>`).join("")}
      ${c.explanation ? `<div>보정: ${esc(c.explanation)}</div>` : ""}
      ${(p.evs || []).filter(e => e.kind === "DECISION" && e.label !== "Memory").map(e => `<div>${esc(mdhm(e.at))} ${esc(people(e.summary))}</div>`).join("")}
    </div></details>`;
}

function readingHtml(e, roleLabel) {
  const sem = semanticOf(e);
  const r = e.reading;
  if (r && r.source === "rule_fallback") {
    return `<div class="reading ${fx("rd" + e.id)}"><div class="lab">AI 해석 · ${esc(SEMANTIC[sem] || sem)}<span class="by">AI 사용 불가 → 규칙 기반으로 대체</span></div>
      <div class="rawid" style="color:var(--red)">${esc(r.error || "")}</div></div>`;
  }
  const bk = r && r.block_kind ? BLOCK_KIND[r.block_kind] : (sem === "REPORTS_BLOCKED" && e.kind === "REPLY" ? null : null);
  const by = r ? `${modelLabel(S.state.interpreter)}가 답변을 분석했습니다` : "규칙 기반 해석기로 분석했습니다";
  const label = sem === "REPORTS_BLOCKED" ? `막힘 확인${bk ? " / " + bk : ""}` : (SEMANTIC[sem] || sem || "");
  return `<div class="reading ${fx("rd" + e.id)}"><div class="lab">${roleLabel} · ${esc(label)} <span class="by">${esc(by)}</span></div>
    ${r && r.evidence ? `<div class="q">판단 근거 문장: <em>“${esc(r.evidence)}”</em></div>` : ""}
    ${r && r.reason ? `<div class="q">${esc(r.reason)}</div>` : ""}
    <div class="rawid">${ids(e.sources)} ${esc(e.summary)}</div></div>`;
}

function chatHtml(ep, p) {
  if (!p.checkin) return "";
  const q = ep.questions[0];
  let h = `<div class="blk-h">담당자 확인<span class="r">${esc(mdhm(p.checkin.at))}</span></div><div class="chat">`;
  h += `<div class="msg ai ${fx("q" + ep.run_id)}"><div class="who">ContriLog AI → ${esc(ep.assignee)} 님</div>${esc(q ? q.text : "진행 상황을 확인했습니다.")}</div>`;
  if (p.reply) {
    h += `<div class="msg human ${fx("r" + ep.run_id)}"><div class="who">${esc(ep.assignee)} 님 · ${esc(mdhm(p.reply.at))}</div>${esc(p.reply.reply_text)}</div>`;
    const decided = p.block || p.toNormal;
    h += decided ? readingHtml(p.reply, "AI 해석") : `<div class="typing ${fx("t" + ep.run_id)}">${esc(modelLabel(S.state.interpreter))}가 답변을 분석하고 있습니다<i></i><i></i><i></i></div>`;
  } else if (p.noReply) {
    h += `<div class="typing">답장이 오지 않았습니다 · 막힘으로 추측하지 않고 계속 관찰합니다</div>`;
  } else if (!p.toNormal) {
    h += `<div class="typing">답장을 기다리고 있습니다<i></i><i></i><i></i></div>`;
  }
  return h + `</div>`;
}

function recLine(r) {
  if (!r) return "";
  const what = r.type === "revision" ? `‘${esc(r.title)}’ 수정: ${esc(r.text)}` : r.type === "message" ? `“${esc(r.text)}”` : esc(r.title || "");
  return `<span class="rec" title="${esc((r.title ? r.title + ': ' : '') + (r.text || ''))}">${what}${r.at ? ` · ${esc(md(r.at))}` : ""} <span class="rawid">${ids([r.id])}</span></span>`;
}

function supportHtml(ep, p) {
  if (!p.analysis) return "";
  const sp = ep.support || {};
  if (!sp.supporter) {
    return `<div class="panel"><h3>팀 내 지원을 제안하지 않았습니다</h3>
      <div style="font-size:13.5px;color:var(--ink-2)">${sp.block_kind === "EXTERNAL_DEPENDENCY" ? "팀 밖의 승인·외부 의존으로 막힌 문제라 팀원의 지원으로는 해결되지 않습니다." : "기록에서 이 문제를 도울 근거가 있는 동료를 찾지 못했습니다."}</div>
      <details class="tech"><summary>근거 상세 보기</summary><div class="in">${esc(people(sp.reason))}</div></details></div>`;
  }
  const ticks = [];
  if (sp.best_record) ticks.push(`이 문제와 관련된 작업 기록이 있습니다${recLine(sp.best_record)}`);
  if (sp.prior_help && sp.prior_help.length) ticks.push(`이전에 ${esc(ep.assignee)} 님의 문제를 도운 기록이 있습니다${recLine(sp.prior_help[0])}`);
  if (sp.no_urgent_task) ticks.push(`현재 마감이 임박한 본인 업무가 없습니다`);
  const msg = ep.action && p.proposed ? ep.action.message : "";
  return `<div class="panel ${fx("sp" + ep.run_id)}">
      <div class="blk-h" style="margin-bottom:4px">지원 제안<span class="r">${esc(mdhm(p.analysis.at))}</span></div>
      <h3>${esc(sp.supporter)} 님에게 지원을 요청하는 것을 제안합니다</h3>
      <ul class="ticks">${ticks.map(t => `<li>${t}</li>`).join("")}</ul>
      ${sp.others && sp.others.length ? `<div class="others">다른 지원 가능 인원: ${esc(sp.others.join(", "))} — 위 근거가 가장 직접적인 사람을 골랐습니다</div>` : ""}
      ${msg ? `<div class="quote" title="${esc(noIds(msg))}"><span class="k">${p.rejected ? "보내지 않은 메시지 (PM 거절)" : p.sent ? "전송한 메시지" : "승인하면 보낼 메시지"}</span><span class="tx">${esc(noIds(msg))}</span></div>` : ""}
      <details class="tech"><summary>근거 상세 보기</summary><div class="in">
        <div>${esc(people(sp.reason))}</div>
        <div>관련 기록 ${ids((sp.related_records || []).map(r => r.id))} · 이전 지원 ${ids((sp.prior_help || []).map(r => r.id))}</div>
        ${ep.action ? `<div>요청 ${ids([ep.action.action_id])} · 원문: ${esc(msg)}</div>` : ""}
      </div></details>
    </div>`;
}

function decisionHtml(ep, p) {
  if (!p.proposed) return "";
  if (p.pending && !p.human) {
    return `<div class="decide ${fx("dc" + ep.run_id)}" id="decideBox">
        <h3>PM의 결정이 필요합니다</h3>
        <p>승인하기 전에는 지원 요청이 전송되지 않습니다. AI는 스스로 요청을 보낼 수 없습니다.</p>
        <div class="btns">
          <button class="btn reject" onclick="decide('${esc(p.pending.action_id)}', false)" ${S.busy ? "disabled" : ""}>거절</button>
          <button class="btn approve" onclick="decide('${esc(p.pending.action_id)}', true)" ${S.busy ? "disabled" : ""}>지원 요청 승인</button>
        </div></div>`;
  }
  if (!p.human) return "";
  const hist = (ep.action && ep.action.history) || [];
  const appr = hist.find(h => h.status === "APPROVED" || h.status === "REJECTED");
  if (p.rejected) {
    return `<div class="decided nok ${fx("dn" + ep.run_id)}"><div class="ln r">✕ PM이 지원 요청을 거절했습니다<small>${appr ? esc((appr.by ? appr.by + " · " : "") + mdhm(appr.at)) : ""}</small></div>
      <div style="font-size:13px;color:var(--ink-2)">요청은 전송되지 않았습니다. AI는 다른 방식으로 개입하지 않고 상황만 계속 지켜봅니다.</div></div>`;
  }
  const sent = hist.find(h => h.status === "SENT");
  return `<div class="decided okk ${fx("do" + ep.run_id)}">
      <div class="ln g">✓ PM 승인 완료<small>${appr ? esc((appr.by ? "PM " + appr.by + " · " : "") + mdhm(appr.at)) : ""}</small></div>
      ${p.sent ? `<div class="ln g ${fx("sn" + ep.run_id)}">✓ 지원 요청 전송 — ${esc(ep.action.recipient)} 님께<small>${sent ? esc(mdhm(sent.at)) : ""}</small></div>` : `<div class="ln" style="color:var(--muted)">지원 요청을 전송하는 중…</div>`}
    </div>`;
}

function afterSendHtml(ep, p) {
  if (!p.sent && !p.resolved) return "";
  let h = "";
  if (p.supResp) {
    const sem = semanticOf(p.supResp);
    h += `<div class="chat"><div class="msg human ${fx("sr" + ep.run_id)}"><div class="who">${esc(ep.action.recipient)} 님 · ${esc(mdhm(p.supResp.at))}</div>${esc(p.supResp.reply_text || "")}</div>${readingHtml(p.supResp, "AI 해석")}</div>`;
    if (sem && sem !== "ACCEPTS_SUPPORT") {
      const r = ep.support && ep.support.best_record;
      h += `<div class="limit ${fx("lm" + ep.run_id)}"><div class="t">⚠ AI 제안의 한계 — 현재 기록만으로는 최적 지원자를 정확히 판단하지 못했습니다</div>
        <div class="d">${esc(ep.action.recipient)} 님이 원인을 잘 모른다고 답했습니다.${r ? ` 선정 근거였던 기록은 ‘${esc(r.title)}: ${esc(r.text)}’로, 이 문제의 원인과 직접 관련된 기록이 아니었습니다.` : ""}
        AI는 지원자 답장만으로 해결을 판단하지 않고, 실제 작업 기록을 계속 확인합니다.</div></div>`;
    }
  }
  if (p.resolved) {
    const fu = [...ep.follow_ups].reverse().find(f => f.resolved);
    const recs = fu ? fu.records : [];
    const rev = recs.find(r => r.type === "revision");
    const base = ep.confirmed_at;
    h += `<div class="resolve ok ${fx("ro" + ep.run_id)}"><div class="t">✓ 해결 확인 — ${rev ? "새로운 수정 기록을 확인했습니다" : "업무 기록의 변화를 확인했습니다"}</div>
      <div class="d">${p.sent ? "지원 요청 이후에 생긴" : "지원 요청 없이, 막힘 확인 이후에 생긴"} 실제 작업 기록을 근거로 판단했습니다. 답장만으로 해결이라고 판단하지 않습니다.</div>
      ${rev ? `<div class="rec">${esc(rev.who)} 님 · ${esc(mdhm(rev.at))}<br>‘${esc(rev.title)}’ 수정: ${esc(rev.text)}</div>` : recs.length ? `<div class="rec">${esc(recs.map(r => r.title).join(", "))} 상태 변화</div>` : ""}
      <details class="tech"><summary>근거 상세 보기</summary><div class="in">${base ? `<div>막힘 확인 후 해결까지 ${dur(hoursBetween(base, p.resolved.at))}</div>` : ""}<div>${ids(p.resolved.sources)} ${esc(p.resolved.summary)}</div></div></details></div>`;
    if (p.resolvedMem) h += `<div class="memnote ${fx("mn" + ep.run_id)}">✓ 이번 결과(지원 후 해결)를 AI 판단 보정 기록에 저장했습니다</div>`;
  } else if (p.sent) {
    const checks = ep.follow_ups.length;
    h += `<div class="resolve watch ${fx("rw" + ep.run_id)}"><div class="t">AI가 실제 해결 여부를 계속 확인하고 있습니다</div>
      <div class="d">지원 요청 후 새 작업 기록이 생기는지 12시간마다 확인합니다.${checks ? ` 지금까지 ${checks}번 확인 · 아직 새 기록 없음` : ""}</div></div>`;
  }
  return h;
}

function renderHero(ep) {
  const s = S.state;
  const busy = S.busy ? `<div class="busy"><i></i>${esc(S.busyText || "AI가 다음 기록을 확인하고 있습니다…")}</div>` : "";
  if (!ep) {
    const others = s.view ? s.view.episodes.filter(e => S.shown.has(`${e.run_id}-0`)) : [];
    const latest = {};
    others.forEach(e => { latest[e.task_id] = e; });
    // 공개된 사건 기준으로 지금 '확인 필요' 이상인 업무가 있는지 (미래 사건은 보지 않음)
    const found = Object.values(latest).some(e => {
      const evs = s.events.filter(x => x.id.startsWith(e.run_id + "-") && S.shown.has(x.id));
      return evs.some(x => transTo(x) === "STAGNATION_CANDIDATE") && !evs.some(x => ["NORMAL", "RESOLVED"].includes(transTo(x)));
    });
    const rows = Object.values(latest).slice(-4).map(e => {
      const st = AGENT_STATE[e.state] || ["", "b-gray"];
      const q = e.questions.length && e.questions[0].status === "AWAITING_REPLY" ? "담당자 답장 대기" : e.state === "NORMAL" ? "확인 결과 정상 진행" : "확인 중";
      return `<div class="w"><b>${esc(e.title)}</b><span class="badge ${st[1]}">${st[0]}</span><span class="x">${esc(e.assignee)} 님 · ${q}</span></div>`;
    }).join("");
    $("hero").innerHTML = `<div class="sect-h"><h2>지금 확인이 필요한 업무</h2></div>
      <div class="idle">
        ${found ? `<div class="big">AI가 확인이 필요한 업무를 발견했습니다</div>
        <div class="d">작업 기록과 마감 상태를 분석한 결과,<br>담당자 확인이 필요한 업무가 있습니다.</div>` : `<div class="big">AI가 프로젝트 기록을 확인하고 있습니다</div>
        <div class="d">문서 수정 기록·메시지·회의록·업무 상태를 12시간마다 살펴보고, 기록이 오래 멈춘 업무를 찾습니다.<br>지금은 PM이 결정해야 할 업무가 없습니다.</div>`}
        ${s.finished ? "" : `<div class="scan"></div>`}
        ${rows ? `<div class="watchlist"><div class="blk-h">다른 업무 확인 현황</div>${rows}</div>` : ""}
      </div>${busy}`;
    return;
  }
  const p = progress(ep);
  const [stTx, stCls] = stage(p);
  const task = s.tasks.find(t => t.task_id === ep.task_id) || {};
  const dueH = task.hours_until_due;
  const dueTx = task.due ? `${md(task.due + "T00:00:00+09:00")}${dueH != null && task.status !== "DONE" && dueH >= 0 ? ` · ${dur(dueH)} 남음` : ""}` : "";
  const overdue = dueH != null && dueH < 0 && task.status !== "DONE";
  const left = judgmentHtml(ep, p) + chatHtml(ep, p);
  const right = supportHtml(ep, p) + decisionHtml(ep, p) + afterSendHtml(ep, p);
  const others = s.pending.length > 1 ? `<div class="others" style="padding:0 18px 10px">결정을 기다리는 다른 제안 ${s.pending.length - 1}건이 있습니다.</div>` : "";
  $("hero").innerHTML = `
    <div class="hero-top">
      <div style="min-width:0">
        <div class="eyebrow">지금 확인이 필요한 업무${ep.task_id !== s.scenario.focus_task ? " · 다른 업무에서 결정 요청" : ""}</div>
        <div class="hero-title">${esc(ep.title)}</div>
        <div class="hero-meta"><span>담당자 <b>${esc(ep.assignee)}</b></span><span>마감 <b class="${overdue ? "warn" : ""}">${esc(dueTx)}${overdue ? " · 마감 지남" : ""}</b></span><span>업무 상태 <b>${esc(TASK_STATUS[task.status] || task.status || "")}</b></span></div>
      </div>
      <div class="st"><span class="badge b-big ${stCls}">${esc(stTx)}</span></div>
    </div>
    ${stepperHtml(p)}
    ${others}
    <div class="hero-body"><div class="col">${left}</div><div class="col">${right || `<div class="panel" style="color:var(--muted);font-size:13.5px;border-style:dashed">${p.toNormal ? "정상 진행으로 확인되어 지원 제안 단계가 필요 없습니다." : "담당자 확인 결과에 따라 다음 단계가 여기에 나타납니다."}</div>`}</div></div>
    ${busy}`;
  const box = $("decideBox");
  if (box && S.lastDecideFor !== p.pending.action_id) {
    S.lastDecideFor = p.pending.action_id;
    box.classList.add("flash");
    box.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
}

function renderMemory() {
  const s = S.state, v = s.view ? s.view.memory : {counts: {}, adjustments: []};
  const shownMem = new Set(s.events.filter(e => e.label === "Memory" && S.shown.has(e.id)).map(e => (/MEM-\d+/.exec(e.summary) || [])[0]));
  const mems = s.memories.filter(m => shownMem.has(m.id));
  const cnt = {};
  mems.forEach(m => { cnt[m.label] = (cnt[m.label] || 0) + 1; });
  const adjs = (v.adjustments || []).filter(a => D(a.at) <= D(s.as_of)).slice(-2).reverse().map(a => {
    const fp = a.applied_memories.filter(m => m.label === "FALSE_POSITIVE").length;
    const tp = a.applied_memories.filter(m => m.label === "TRUE_POSITIVE").length;
    let h, w;
    if ((a.memory_adjustment_hours || 0) > 0) {
      h = `허용 공백 +${dur(a.memory_adjustment_hours)}`;
      w = `과거 같은 상황에서 ‘괜한 확인’이 ${fp}번 있어 기준을 조금 완화했습니다 (${dur(a.base_limit_hours)} → ${dur(a.limit_hours)})`;
    } else if (a.applied_memories.length) {
      h = "허용 공백 +0시간 (완화하지 않음)";
      w = `과거 같은 상황에서 실제 막힘이 ${tp}번 확인되어 기준을 그대로 유지했습니다`;
    } else {
      h = `팀 휴지기 ${dur(a.team_pause_hours)} 제외`;
      w = a.base_is_candidate && !a.is_candidate ? "팀 전체가 쉬던 기간이라 확인 질문을 보내지 않았습니다" : "팀 전체가 쉬던 기간을 공백에서 뺐습니다";
    }
    return `<div class="adj"><div class="h">${esc(h)}</div><div>${esc(a.title)} · ${esc(md(a.at))}</div><div class="w">${esc(w)}</div>
      <details class="tech"><summary>근거 상세 보기</summary><div class="in">${ids([a.task_id])} ${ids(a.applied_memories.map(m => m.id))}<div>${esc(a.explanation || "")}</div></div></details></div>`;
  }).join("");
  const order = ["TRUE_POSITIVE", "FALSE_POSITIVE", "RESOLUTION_SUCCESS", "UNRESOLVED"];
  $("memCard").innerHTML = `<div class="sect-h"><h2>AI 판단 보정</h2><span class="r">기록 ${mems.length}건</span></div>
    <div class="memc">
      <div class="intro">AI가 자신의 과거 판단이 맞았는지를 상황별로 기록해, 다음 판단의 기준(허용 공백)을 정해진 범위 안에서만 조금씩 보정합니다.</div>
      <div class="mcount">${order.map(k => `<div><span>${MEM_LABEL[k]}</span><b>${cnt[k] || 0}</b></div>`).join("")}</div>
      ${adjs || `<div class="w" style="font-size:12.5px;color:var(--muted)">아직 판단 기준을 보정한 적이 없습니다.</div>`}
      <div class="privacy">개인별 평가·점수에는 사용하지 않습니다. 기록에는 사람·업무 이름 없이 상황(마감 임박도·공백 비율·팀 활동)만 남습니다.</div>
    </div>`;
  $("rawMem").innerHTML = mems.length ? `<div class="blk-h" style="margin-top:2px">Memory 원본</div>` + [...mems].reverse().map(m =>
    `<div><span class="id">${esc(m.id)}</span> ${esc(m.label)} · ${esc(mdhm(m.at))}<br>${esc(m.pattern)}</div>`).join("") : "";
}

function feedLine(e) {
  const s = S.state;
  const t = `<span class="tk">${esc(e.task_title)}</span>`;
  const sem = semanticOf(e), to = transTo(e);
  const sup = s.view && s.view.episodes.find(x => e.id.startsWith(x.run_id + "-"));
  const supName = sup && sup.support && sup.support.supporter;
  const rcpt = sup && sup.action && sup.action.recipient;
  switch (e.kind) {
    case "OBSERVE": return [false, `${t}<br>작업 기록 공백이 길어 살펴봤습니다`];
    case "CHECK_IN": return [true, `${t}<br><b>${esc(e.assignee)}</b> 님에게 진행 상황을 물었습니다`];
    case "REPLY": return e.reply_text ? [true, `${t}<br><b>${esc(e.assignee)}</b> 님 답장 → <b>${esc(SEMANTIC[sem] || sem)}</b>`] : [false, `${t}<br>답장이 없어 계속 지켜봅니다`];
    case "SUPPORT_ANALYSIS": return [true, `${t}<br>${supName ? `지원 가능한 동료로 <b>${esc(supName)}</b> 님을 찾았습니다` : "팀 내 지원 대상이 없다고 판단했습니다"}`];
    case "INTERVENTION": return [true, `${t}<br><b>지원 제안</b> — PM 결정을 기다립니다`];
    case "HUMAN": return [true, `${t}<br>PM이 지원 요청을 <b>${/APPROVED/.test(e.summary) ? "승인" : "거절"}</b>했습니다`];
    case "ACTION": return [true, `${t}<br><b>${esc(rcpt || "")}</b> 님에게 지원 요청을 전송했습니다`];
    case "SUPPORT_RESPONSE": return [true, `${t}<br>지원자 답장 → <b>${esc(SEMANTIC[sem] || sem)}</b>`];
    case "FOLLOW_UP": return [false, `${t}<br>지원 이후 새 작업 기록을 확인했습니다`];
    case "DECISION":
      if (e.label === "Memory") return [/RESOLUTION_SUCCESS/.test(e.summary), `${t}<br>판단 결과를 AI 판단 보정 기록에 저장 (${esc(MEM_LABEL[(/(TRUE_POSITIVE|FALSE_POSITIVE|RESOLUTION_SUCCESS|UNRESOLVED)/.exec(e.summary) || [])[1]] || "")})`];
      if (to === "STAGNATION_CANDIDATE") return [true, `${t}<br><span class="badge b-check">확인 필요</span> 작업 기록이 오래 멈춰 있습니다`];
      if (to === "CONFIRMED_BLOCK") return [true, `${t}<br><span class="badge b-block">막힘 확인</span> ${/EXTERNAL/.test(e.summary) ? "외부 의존 문제" : "내부 기술 문제"}`];
      if (to === "NORMAL") return [true, `${t}<br><span class="badge b-ok">정상 진행</span> ${/완료/.test(e.summary) ? "업무 완료 확인" : "추가 조치 없음"}`];
      if (to === "RESOLVED") return [true, `${t}<br><span class="badge b-done">해결 확인</span> 새 작업 기록 확인`];
      return [false, `${t}<br>${esc(people(e.summary))}`];
    default: return [false, `${t}<br>${esc(people(e.summary))}`];
  }
}

function renderFeed() {
  const s = S.state;
  const evs = s.events.filter(e => S.shown.has(e.id));
  const items = evs.slice(-40).reverse().map(e => {
    const [key, html] = feedLine(e);
    return `<div class="fe ${key ? "key" : ""} ${fx("fe" + e.id)}"><div class="tm">${esc(md(e.at))}<br>${esc(hm(e.at))}</div>
      <div class="tx">${html}<div class="raw rawid">${esc(e.label)} · ${esc(e.task_id)} · ${esc(e.summary)} ${ids(e.sources)}</div></div></div>`;
  });
  $("feed").innerHTML = items.length ? items.join("") : `<div class="empty">아직 기록이 없습니다.</div>`;
  $("feedNote").textContent = demo ? "핵심 사건만" : `${evs.length}건`;
}

function renderTech() {
  const st = S.state.stats;
  $("stats").innerHTML = [["Tool 호출", st.tool_calls], ["확인 질문", st.questions], ["확인 필요 판단", st.candidates], ["막힘 확인", st.blocks],
    ["해결 확인", st.resolved], ["관찰 횟수", st.wakes]].map(([l, n]) => `<div>${l}<b>${n}</b></div>`).join("") +
    `<div style="grid-column:1/-1">답장 해석기<b style="font-size:13px">${esc(S.state.interpreter)}</b></div>`;
}

function renderTable(tasks, ep) {
  const rank = {CONFIRMED_BLOCK: 0, STAGNATION_CANDIDATE: 1, RESOLVED: 2, NORMAL: 3};
  const rows = [...tasks].sort((a, b) => (rank[a.agent_state] - rank[b.agent_state]) || ((a.status === "DONE") - (b.status === "DONE")) || a.due.localeCompare(b.due));
  $("taskRows").innerHTML = rows.map(t => {
    const st = AGENT_STATE[t.agent_state] || [t.agent_state, "b-gray"];
    const open = t.status !== "DONE";
    const od = open && t.hours_until_due < 0;
    return `<tr class="${ep && ep.task_id === t.task_id ? "hl" : ""}">
      <td><span class="t1">${esc(t.title)}</span> <span class="id rawid" style="margin-left:4px">${esc(t.task_id)}</span></td>
      <td>${esc(t.assignees.join(", "))}</td>
      <td class="${od ? "od" : "mut"}">${esc(md(t.due + "T00:00:00+09:00"))}${od ? " · 지남" : ""}</td>
      <td class="mut hide-s">${esc(TASK_STATUS[t.status] || t.status)}</td>
      <td><span class="badge ${st[1]}">${st[0]}</span></td></tr>`;
  }).join("");
  $("taskNote").textContent = `${tasks.length}개 업무 · 상태는 색과 글자로 함께 표시`;
}

// ------------------------------------------------------------ 조작
function setBusy(on, text) { S.busy = on; S.busyText = text; render(); }
async function start() {
  stopPlay();
  clearTimeout(S.timer);
  S.state = null; S.shown = new Set(); S.seen = new Set(); S.queue = []; S.heroRun = null; S.prevTasks = null; S.lastDecideFor = null; S.decidedRun = null;
  $("btnStart").disabled = true;
  describeScenario();
  $("hero").innerHTML = `<div class="sect-h"><h2>지금 확인이 필요한 업무</h2></div><div class="idle"><div class="big">AI가 프로젝트 기록을 확인하고 있습니다</div>
    <div class="d">문서 수정 기록·메시지·회의록·업무 상태를 불러오는 중입니다.</div><div class="scan"></div></div>`;
  try {
    const st = await api("/api/start", {scenario: $("scenario").value, interpreter: $("interpreter").value});
    await ingest(st, true);
  } catch (e) { toast(`시작하지 못했습니다: ${e.message}`); }
  finally { $("btnStart").disabled = false; render(); }
}
async function next() {
  S.decidedRun = null;
  if (revealing()) {
    if (demo) { revealToCheckpoint(); return; }
    clearTimeout(S.timer); S.queue.forEach(e => S.shown.add(e.id)); S.queue = []; render(); return;
  }
  setBusy(true, "AI가 다음 기록을 확인하고 있습니다… (답장이 오면 AI가 해석합니다)");
  try { const st = await api("/api/advance", {mode: "event", task_only: true}); S.busy = false; await ingest(st, false); }
  catch (e) { S.busy = false; stopPlay(); toast(`진행하지 못했습니다: ${e.message}`); render(); }
}
async function decide(id, approve) {
  if (S.busy) return;
  const ep = S.state.view.episodes.find(e => e.action && e.action.action_id === id);
  S.decidedRun = ep ? ep.run_id : null;
  setBusy(true, approve ? "PM 승인을 반영하고 있습니다…" : "PM 거절을 반영하고 있습니다…");
  try { const st = await api("/api/decide", {action_id: id, approve}); S.busy = false; await ingest(st, false); }
  catch (e) { S.busy = false; toast(`결정을 반영하지 못했습니다: ${e.message}`); render(); }
}
window.decide = decide;
function stopPlay() { S.playing = false; $("btnPlay").textContent = "자동 진행"; }
async function loop() {
  while (S.playing) {
    const s = S.state;
    if (!s || ((s.finished || s.pending.length) && !revealing())) break;
    await next();
    if (!S.playing) break;
    await new Promise(r => setTimeout(r, demo ? 1600 : 1000));
  }
  stopPlay(); render();
}
function describeScenario() {
  const k = $("scenario").value;
  $("scnDesc").textContent = (SCN[k] || {}).desc || "";
}

async function init() {
  render();
  try {
    const list = await api("/api/scenarios");
    $("scenario").innerHTML = list.map(x => `<option value="${esc(x.key)}">${esc((SCN[x.key] || {}).name || x.title)}</option>`).join("");
    describeScenario();
    const cur = await api("/api/state");
    if (!cur.empty) { $("scenario").value = cur.scenario.key; describeScenario(); await ingest(cur, true); }
    else $("hero").innerHTML = `<div class="sect-h"><h2>지금 확인이 필요한 업무</h2></div><div class="idle"><div class="big">시나리오를 고르고 ‘새로 시작’을 누르세요</div>
      <div class="d">AI가 프로젝트 기록을 시간 순서대로 확인하며, 막힌 업무를 찾아 PM의 결정을 요청합니다.</div></div>`;
  } catch (e) { toast(`서버에 연결하지 못했습니다: ${e.message}`); }
}

$("scenario").onchange = describeScenario;
$("btnStart").onclick = start;
$("btnNext").onclick = () => { stopPlay(); next(); };
$("btnPlay").onclick = () => { if (S.playing) { stopPlay(); return; } S.playing = true; $("btnPlay").textContent = "일시정지"; loop(); };
$("showIds").onchange = e => { document.body.classList.toggle("showids", e.target.checked); };
$("demoMode").onchange = e => { demo = e.target.checked;
  if (!demo && S.queue.length) { clearTimeout(S.timer); S.queue.forEach(x => S.shown.add(x.id)); S.queue = []; } try { localStorage.setItem("contrilog.demo", demo ? "1" : "0"); } catch (x) { /* 무시 */ } render(); };
init();
</script>
